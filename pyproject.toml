[project]
name = "nlp-project"
version = "0.1.0"
description = "5-class Yelp review star-rating classification with scikit-learn Bag-of-Words/TF-IDF features and logistic regression."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contractions>=0.1.73",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
deep = [
    "gensim>=4.4.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-v"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (may use external resources)",
]

[tool.coverage.run]
source = ["src"]
omit   = ["src/__init__.py", "src/*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
